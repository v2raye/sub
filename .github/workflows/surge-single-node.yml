name: Surge single-node rules

on:
  pull_request:
    paths:
      - 'Surge/SingleNode/**'
      - '.github/workflows/surge-single-node.yml'
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reproduce committed rules
        shell: bash
        run: |
          revision=$(node -p "require('./Surge/SingleNode/Rules/stats.json').revision")
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          upstream="$RUNNER_TEMP/surge-dlc"
          git init "$upstream"
          git -C "$upstream" fetch --depth 1 https://github.com/v2fly/domain-list-community.git "$revision"
          git -C "$upstream" checkout --detach FETCH_HEAD
          node Surge/SingleNode/generate.mjs --check "$upstream"

  update:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: surge-single-node-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate and validate rules
        shell: bash
        run: |
          upstream="$RUNNER_TEMP/surge-dlc"
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git "$upstream"
          sukka="$RUNNER_TEMP/surge-sukka"
          mkdir "$sukka"
          for file in domestic.conf global.conf; do
            curl --proto '=https' --fail --silent --show-error --retry 2 --max-time 30 \
              --max-filesize 1048576 --output "$sukka/$file" "https://ruleset.skk.moe/List/non_ip/$file"
          done
          node Surge/SingleNode/generate.mjs --write "$upstream" "$sukka"
          cp "$sukka/"*.conf Surge/SingleNode/Sources/Sukka/
          node Surge/SingleNode/generate.mjs --check "$upstream"
      - name: Publish validated snapshot
        shell: bash
        run: |
          git add -- Surge/SingleNode/Rules Surge/SingleNode/Sources/Sukka
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Surge single-node rules'
          git push origin HEAD
