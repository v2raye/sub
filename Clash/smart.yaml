# ImmortalWrt / OpenClash / OIX or Smart-capable Mihomo core
# Smart edition: requires Model.bin in the core working directory.
# Created 2026-10-29. Replace REPLACE_WITH_YOUR_MIHOMO_SUBSCRIPTION_URL.
# This is a new profile. It does not contain the old private COX relay.
# OpenClash manages transparent interception, firewall and DNS forwarding.
# Keep controller/proxy/DNS ports inaccessible from WAN.
mixed-port: 7893
port: 7890
socks-port: 7891
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: off
external-controller: 127.0.0.1:9090
# OpenClash may replace controller binding and secret with its own settings.
profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  parse-pure-ip: false
  override-destination: false
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: false
  skip-domain:
    - '+.push.apple.com'
    - '+.oray.com'
    - '+.sunlogin.net'

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # IPv6 fake addresses are not explicitly enabled in this baseline.
  # OpenClash can inject fake-ip-range6; inspect its effective configuration.
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localdomain'
    - '*.localhost'
    - '+.home.arpa'
    - '*.arpa'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'local.adguard.org'
    - 'injections.adguard.org'
    - 'time.*'
    - 'ntp.*'
    - '+.pool.ntp.org'
    - 'stun.*.*'
    - 'stun.*.*.*'
    - '+.stun.playstation.net'
    - '+.srv.nintendo.net'
  use-hosts: true
  use-system-hosts: true
  prefer-h3: false
  # Explicit #PROXY routes avoid depending on general DNS routing rules.
  respect-rules: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - 'https://dns.google/dns-query#PROXY'
    - 'https://cloudflare-dns.com/dns-query#PROXY'
  nameserver-policy:
    'rule-set:cn-domain':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

proxy-providers:
  subscription:
    type: http
    url: ''
    path: ./proxy_provider/smart-subscription.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true

# Script-injected exits: accept COX / Seattle with optional flags and separators.
FilterCOX: &FilterCOX '(?i)(?:^|[^a-z0-9])COX(?:[^a-z0-9]|$)'
FilterExit: &FilterExit '(?i)(?:^|[^a-z0-9])(?:COX|Seattle)(?:[^a-z0-9]|$)'
FilterRelay: &FilterRelay '(?i)(🇭🇰|🇯🇵|🇺🇸|香港|日本|美国|美國|Hong[ _-]*Kong|Japan|United[ _-]*States|(?:^|[^a-z0-9])(?:HK|JP|US|USA)(?:[0-9]+)?(?:[^a-z0-9]|$))'

# Shared YAML templates (flow mapping style).
smart: &smart {type: smart, use: [subscription], uselightgbm: true, collectdata: false, prefer-asn: false, url: 'https://cp.cloudflare.com/generate_204', interval: 600, timeout: 5000, tolerance: 100, lazy: true}
rule-domain: &rule-domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: PROXY}
rule-ip: &rule-ip {<<: *rule-domain, behavior: ipcidr}
proxies: []
proxy-groups:
  - {name: PROXY, type: select, proxies: [香港, 日本, 美国]}
  - {name: Apple, type: select, proxies: [香港, 日本, 美国, DIRECT]}
  - {name: Microsoft, type: select, proxies: [香港, 日本, 美国, DIRECT]}
  - {name: Spotify, type: select, proxies: [香港]}
  - {name: Google, type: select, proxies: [香港, 日本, 美国]}
  - {name: Telegram, type: select, proxies: [香港, 日本, 美国]}
  - {name: OpenAI, type: select, proxies: [美国], include-all-proxies: true, filter: *FilterCOX}
  - {name: Emby, type: select, proxies: [香港, DIRECT]}
  - {name: 香港, <<: *smart, filter: '(?i)(🇭🇰|香港|Hong[ _-]*Kong|(?:^|[^a-z0-9])HK(?:[0-9]+)?(?:[^a-z0-9]|$))'}
  - {name: 日本, <<: *smart, filter: '(?i)(🇯🇵|日本|Japan|(?:^|[^a-z0-9])JP(?:[0-9]+)?(?:[^a-z0-9]|$))'}
  - {name: 美国, <<: *smart, filter: '(?i)(🇺🇸|美国|美國|United[ _-]*States|(?:^|[^a-z0-9])(?:US|USA)(?:[0-9]+)?(?:[^a-z0-9]|$))', include-all-proxies: true, exclude-filter: *FilterCOX}
  - {name: Relay, <<: *smart, filter: *FilterRelay, exclude-filter: *FilterExit}

rule-providers:
  lan-domain:
    <<: *rule-domain
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs'
    path: ./rule_provider/smart-lan-domain.mrs
  lan-ip:
    <<: *rule-ip
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs'
    path: ./rule_provider/smart-lan-ip.mrs
  apple:
    <<: *rule-domain
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs'
    path: ./rule_provider/smart-apple.mrs
  microsoft:
    <<: *rule-domain
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs'
    path: ./rule_provider/smart-microsoft.mrs
  spotify:
    <<: *rule-domain
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/spotify.mrs'
    path: ./rule_provider/smart-spotify.mrs
  google:
    <<: *rule-domain
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs'
    path: ./rule_provider/smart-google.mrs
  telegram:
    <<: *rule-domain
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs'
    path: ./rule_provider/smart-telegram.mrs
  openai:
    <<: *rule-domain
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/openai.mrs'
    path: ./rule_provider/smart-openai.mrs
  cn-domain:
    <<: *rule-domain
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs'
    path: ./rule_provider/smart-cn-domain.mrs
  cn-ip:
    <<: *rule-ip
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs'
    path: ./rule_provider/smart-cn-ip.mrs
  proxy:
    <<: *rule-domain
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs'
    path: ./rule_provider/smart-proxy.mrs

rules:
  - RULE-SET,lan-domain,DIRECT
  - OR,((DOMAIN-KEYWORD,adobe),(DOMAIN-SUFFIX,adobe.com),(DOMAIN-SUFFIX,adobe.io)),REJECT
  - OR,((DOMAIN,emby.as174.de),(DOMAIN,cf.bili.rip),(DOMAIN,cdn.sexemby.com)),Emby
  - RULE-SET,openai,OpenAI
  - RULE-SET,apple,Apple
  - RULE-SET,microsoft,Microsoft
  - RULE-SET,spotify,Spotify
  - RULE-SET,google,Google
  - RULE-SET,telegram,Telegram
  - RULE-SET,cn-domain,DIRECT
  - RULE-SET,proxy,PROXY
  - RULE-SET,lan-ip,DIRECT,no-resolve
  - RULE-SET,cn-ip,DIRECT,no-resolve
  - MATCH,PROXY
